<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>할 일 관리</title>
<script src="https://apis.google.com/js/api.js" async defer onload="gapiLoaded()"></script>
<script src="https://accounts.google.com/gsi/client" async defer onload="gisLoaded()"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3;
    --surface: #ffffff;
    --border: #e8e6e1;
    --border-hover: #d0cdc5;
    --text-primary: #37352f;
    --text-secondary: #9b9589;
    --text-done: #b5b1ab;
    --accent: #2383e2;
    --accent-light: #e8f1fb;
    --accent-hover: #0f73d9;
    --check-bg: #2383e2;
    --check-border: #ccc8c3;
    --danger: #e03e3e;
    --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
    --radius: 6px;
    --radius-lg: 10px;
    --transition: 0.18s ease;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Noto Sans KR', 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 52px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: var(--shadow-sm);
  }
  .header-icon {
    font-size: 20px;
    line-height: 1;
  }
  .header-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.01em;
  }
  .header-date {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-secondary);
    font-weight: 300;
  }

  /* ── Page ── */
  .page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 24px 24px;
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .todo-col {
    flex: 1;
    min-width: 0;
  }

  .calendar-col {
    width: 320px;
    flex-shrink: 0;
    position: sticky;
    top: 72px;
  }

  .page-title {
    font-size: 32px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.03em;
    margin-bottom: 28px;
    line-height: 1.2;
  }

  /* ── Calendar ── */
  .calendar-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px 14px;
    border-bottom: 1px solid var(--border);
  }

  .cal-month-label {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.02em;
  }

  .cal-nav {
    display: flex;
    gap: 4px;
  }

  .cal-nav-btn {
    background: transparent;
    border: none;
    width: 28px;
    height: 28px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all var(--transition);
    font-size: 14px;
  }
  .cal-nav-btn:hover {
    background: var(--bg);
    color: var(--text-primary);
  }

  .cal-grid {
    padding: 12px 14px 16px;
  }

  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 6px;
  }

  .cal-weekday {
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-secondary);
    padding: 4px 0;
  }
  .cal-weekday:first-child { color: #e03e3e; }
  .cal-weekday:last-child  { color: var(--accent); }

  .cal-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
  }

  .cal-day {
    aspect-ratio: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text-primary);
    transition: background var(--transition);
    position: relative;
  }
  .cal-day:hover { background: var(--bg); }
  .cal-day.empty { cursor: default; }
  .cal-day.empty:hover { background: transparent; }
  .cal-day.sunday { color: #e03e3e; }
  .cal-day.saturday { color: var(--accent); }
  .cal-day.other-month { color: #ccc8c3; }
  .cal-day.today {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .cal-day.today:hover { background: var(--accent-hover); }
  .cal-day.selected {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 600;
  }
  .cal-day.today.selected {
    background: var(--accent);
    color: #fff;
  }

  .cal-today-btn {
    font-size: 11px;
    color: var(--text-secondary);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
    font-family: inherit;
    transition: all var(--transition);
  }
  .cal-today-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .cal-auth-btn {
    font-size: 11px;
    color: #fff;
    background: #4285f4;
    border: none;
    border-radius: 4px;
    padding: 3px 9px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 500;
    transition: all var(--transition);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .cal-auth-btn:hover { background: #3367d6; }
  .cal-auth-btn:disabled { background: #ccc; cursor: default; }
  .cal-auth-btn.synced { background: #34a853; }

  .event-dot-row {
    display: flex;
    justify-content: center;
    gap: 2px;
    position: absolute;
    bottom: 3px;
    left: 0; right: 0;
  }
  .event-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #4285f4;
  }
  .cal-day { position: relative; }
  .cal-day.today .event-dot { background: #fff; }

  .cal-event-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }
  .cal-event-item:last-child { border-bottom: none; }
  .cal-event-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4285f4;
    flex-shrink: 0;
    margin-top: 3px;
  }
  .cal-event-title { color: var(--text-primary); font-weight: 400; line-height: 1.4; }
  .cal-event-time  { color: var(--text-secondary); font-size: 11px; }
  .cal-panel-date  { font-size: 12px; font-weight: 500; color: var(--text-secondary); padding: 8px 0 4px; }
  .cal-no-event    { font-size: 12px; color: var(--text-secondary); padding: 8px 0; }

  /* ── Upcoming ── */
  .upcoming-card {
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .upcoming-header {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .upcoming-header::before {
    content: '📅';
    font-size: 13px;
  }
  .upcoming-list {
    padding: 4px 0 8px;
    max-height: 320px;
    overflow-y: auto;
  }
  .upcoming-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 16px;
    transition: background var(--transition);
    cursor: default;
  }
  .upcoming-item:hover { background: var(--bg); }
  .upcoming-date-badge {
    flex-shrink: 0;
    width: 36px;
    text-align: center;
    background: var(--accent-light);
    border-radius: 6px;
    padding: 4px 2px;
  }
  .upcoming-date-badge .badge-month {
    font-size: 10px;
    color: var(--accent);
    font-weight: 500;
    line-height: 1;
  }
  .upcoming-date-badge .badge-day {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    line-height: 1.2;
  }
  .upcoming-date-badge.today-badge {
    background: var(--accent);
  }
  .upcoming-date-badge.today-badge .badge-month,
  .upcoming-date-badge.today-badge .badge-day {
    color: #fff;
  }
  .upcoming-info { flex: 1; min-width: 0; }
  .upcoming-title {
    font-size: 13px;
    color: var(--text-primary);
    font-weight: 400;
    line-height: 1.4;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .upcoming-time {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: 1px;
  }
  .upcoming-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4285f4;
    flex-shrink: 0;
    margin-top: 5px;
  }
  .upcoming-empty {
    padding: 16px;
    font-size: 12.5px;
    color: var(--text-secondary);
    text-align: center;
  }

  @media (max-width: 800px) {
    body { padding: 0 0 100px; -webkit-tap-highlight-color: transparent; }

    .header { height: 48px; padding: 0 16px; }
    .header-title { font-size: 14px; }
    .header-date { font-size: 11px; }

    .page {
      flex-direction: column;
      padding: 20px 12px 24px;
      gap: 16px;
    }

    .page-title { font-size: 24px; margin-bottom: 18px; }

    .calendar-col { width: 100%; position: static; }

    /* 달력 터치 최적화 */
    .cal-day {
      aspect-ratio: 1;
      font-size: 14px;
      min-height: 38px;
    }
    .cal-header { padding: 12px 14px; }
    .cal-month-label { font-size: 14px; }
    .cal-nav-btn { width: 32px; height: 32px; font-size: 18px; }
    .cal-auth-btn { font-size: 12px; padding: 5px 10px; }
    .cal-today-btn { font-size: 12px; padding: 4px 10px; }
    .cal-grid { padding: 10px 10px 14px; }

    /* 할일 아이템 터치 영역 확대 */
    .todo-item { padding: 9px 12px 9px 10px; }
    .todo-item.sub { padding-left: 36px; }
    .item-actions { opacity: 1; }
    .item-btn { padding: 5px 7px; }
    .check-wrap { width: 18px; height: 18px; margin-top: 1px; }

    /* 섹션 헤더 */
    .section-header { padding: 14px 12px; }
    .section-name { font-size: 14px; }
    .section-del-btn { opacity: 1; }

    /* 추가 입력 */
    .add-item-row { padding: 8px 12px 12px 10px; }
    .add-item-input { font-size: 14px; }
    .add-section-btn { font-size: 13px; padding: 9px 14px; }

    /* 다가오는 일정 */
    .upcoming-item { padding: 10px 14px; }
    .upcoming-title { font-size: 13.5px; }
    .upcoming-header { padding: 13px 16px; }
  }

  /* iPhone SE 등 작은 화면 */
  @media (max-width: 375px) {
    .cal-day { font-size: 13px; }
    .page { padding: 16px 10px 20px; }
  }

  /* ── Add Section ── */
  .add-section-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: transparent;
    border: 1.5px dashed var(--border-hover);
    border-radius: var(--radius);
    color: var(--text-secondary);
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    transition: all var(--transition);
    margin-top: 8px;
  }
  .add-section-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  /* ── Section ── */
  .section {
    margin-bottom: 16px;
    background: var(--surface);
    border-radius: var(--radius-lg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    transition: box-shadow var(--transition);
  }
  .section:hover {
    box-shadow: var(--shadow-md);
  }

  .section-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 14px 16px 14px 12px;
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: background var(--transition), border-color var(--transition);
  }
  .section-header:hover {
    background: var(--bg);
  }
  .section.open .section-header {
    border-bottom-color: var(--border);
  }

  .toggle-arrow {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }
  .toggle-arrow svg {
    width: 14px;
    height: 14px;
  }
  .section.open .toggle-arrow {
    transform: rotate(90deg);
  }

  .section-name {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    flex: 1;
    outline: none;
    border: none;
    background: transparent;
    font-family: inherit;
    cursor: text;
    min-width: 0;
  }
  .section-name:focus {
    color: var(--accent);
  }

  .section-count {
    font-size: 11px;
    color: var(--text-secondary);
    background: var(--bg);
    border-radius: 10px;
    padding: 2px 8px;
    font-weight: 400;
    border: 1px solid var(--border);
  }

  .section-del-btn {
    opacity: 0;
    background: transparent;
    border: none;
    padding: 3px 6px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-secondary);
    transition: all var(--transition);
    font-size: 12px;
  }
  .section-header:hover .section-del-btn {
    opacity: 1;
  }
  .section-del-btn:hover {
    background: #fff0f0;
    color: var(--danger);
  }

  /* ── Items ── */
  .items-list {
    padding: 6px 0;
    display: none;
  }
  .section.open .items-list {
    display: block;
  }

  .todo-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 7px 16px 7px 14px;
    position: relative;
    transition: background var(--transition);
    animation: fadeIn 0.22s ease;
    cursor: grab;
  }
  .todo-item.dragging {
    opacity: 0.4;
    cursor: grabbing;
  }
  .todo-item.drag-over {
    border-top: 2px solid var(--accent);
  }
  .items-list.drag-target {
    background: var(--accent-light);
    border-radius: 0 0 var(--radius-lg) var(--radius-lg);
    min-height: 40px;
  }
  .todo-item:hover {
    background: var(--bg);
  }
  .todo-item.sub {
    padding-left: 42px;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes exitDown {
    0%   { opacity: 1;   transform: translateY(0);   max-height: 60px; }
    60%  { opacity: 0;   transform: translateY(8px);  max-height: 60px; }
    100% { opacity: 0;   transform: translateY(8px);  max-height: 0; margin: 0; padding-top: 0; padding-bottom: 0; }
  }
  @keyframes exitUp {
    0%   { opacity: 1;   transform: translateY(0);   max-height: 60px; }
    60%  { opacity: 0;   transform: translateY(-8px); max-height: 60px; }
    100% { opacity: 0;   transform: translateY(-8px); max-height: 0; margin: 0; padding-top: 0; padding-bottom: 0; }
  }
  @keyframes enterDown {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes enterUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .todo-item.animate-exit-down { animation: exitDown 0.32s cubic-bezier(0.4,0,0.2,1) forwards; pointer-events: none; }
  .todo-item.animate-exit-up   { animation: exitUp   0.32s cubic-bezier(0.4,0,0.2,1) forwards; pointer-events: none; }
  .todo-item.animate-enter-down { animation: enterDown 0.28s cubic-bezier(0.0,0.0,0.2,1); }
  .todo-item.animate-enter-up   { animation: enterUp   0.28s cubic-bezier(0.0,0.0,0.2,1); }

  /* Checkbox */
  .check-wrap {
    position: relative;
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .check-wrap input[type="checkbox"] {
    opacity: 0;
    position: absolute;
    inset: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
    margin: 0;
    z-index: 2;
  }
  .check-box {
    position: absolute;
    inset: 0;
    border: 1.5px solid var(--check-border);
    border-radius: 3px;
    background: #fff;
    transition: all 0.15s ease;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .check-box svg {
    opacity: 0;
    transform: scale(0.6);
    transition: all 0.15s ease;
  }
  .check-wrap input:checked ~ .check-box {
    background: var(--check-bg);
    border-color: var(--check-bg);
  }
  .check-wrap input:checked ~ .check-box svg {
    opacity: 1;
    transform: scale(1);
  }
  .check-wrap:hover .check-box {
    border-color: var(--accent);
  }

  /* Item text */
  .item-text {
    flex: 1;
    font-size: 14px;
    color: var(--text-primary);
    line-height: 1.5;
    outline: none;
    border: none;
    background: transparent;
    font-family: inherit;
    resize: none;
    min-width: 0;
    word-break: break-word;
    transition: color var(--transition);
  }
  .item-text:focus {
    color: var(--text-primary);
  }
  .todo-item.done .item-text {
    color: var(--text-done);
    text-decoration: line-through;
    text-decoration-color: var(--text-done);
  }

  /* Link badge */
  .item-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11.5px;
    color: var(--accent);
    text-decoration: none;
    background: var(--accent-light);
    border-radius: 4px;
    padding: 1px 7px 1px 5px;
    margin-top: 3px;
    width: fit-content;
    transition: background var(--transition);
    word-break: break-all;
  }
  .item-link:hover {
    background: #d0e6fa;
    text-decoration: underline;
  }

  /* Item actions */
  .item-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    opacity: 0;
    transition: opacity var(--transition);
    flex-shrink: 0;
  }
  .todo-item:hover .item-actions {
    opacity: 1;
  }
  .item-btn {
    background: transparent;
    border: none;
    padding: 3px 5px;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 12px;
    font-family: inherit;
    transition: all var(--transition);
    line-height: 1;
  }
  .item-btn:hover {
    background: var(--bg);
    color: var(--text-primary);
  }
  .item-btn.del:hover {
    background: #fff0f0;
    color: var(--danger);
  }
  .item-btn.sub-btn:hover {
    background: var(--accent-light);
    color: var(--accent);
  }

  /* ── Add item row ── */
  .add-item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 16px 10px 14px;
  }
  .add-item-icon {
    width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-secondary);
    flex-shrink: 0;
    margin-top: 1px;
    font-size: 16px;
    line-height: 1;
  }
  .add-item-input {
    flex: 1;
    font-size: 13.5px;
    color: var(--text-secondary);
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
  }
  .add-item-input::placeholder {
    color: #c5c1bb;
  }
  .add-item-input:focus {
    color: var(--text-primary);
  }

  /* ── Divider between pending/done ── */
  .done-divider {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 16px;
    margin: 2px 0;
  }
  .done-divider-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .done-divider-label {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    font-weight: 400;
  }

  /* ── Progress bar ── */
  .section-progress {
    height: 2px;
    background: var(--border);
    overflow: hidden;
  }
  .section-progress-bar {
    height: 100%;
    background: var(--accent);
    transition: width 0.35s ease;
    border-radius: 1px;
  }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ddd9d3; border-radius: 3px; }

  /* ── Memo List Card ── */
  .memo-list-card {
    margin-top: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .memo-list-header {
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .memo-list-header-left { display: flex; align-items: center; gap: 6px; }
  .memo-add-btn {
    width: 24px; height: 24px;
    border-radius: 6px;
    background: var(--accent-light);
    border: none;
    color: var(--accent);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all var(--transition);
  }
  .memo-add-btn:hover { background: var(--accent); color: #fff; }

  .memo-list-body { padding: 4px 0 6px; }

  .memo-list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 16px;
    cursor: pointer;
    transition: background var(--transition);
  }
  .memo-list-item:hover { background: var(--bg); }
  .memo-list-item-icon { font-size: 14px; flex-shrink: 0; }
  .memo-list-item-info { flex: 1; min-width: 0; }
  .memo-list-item-title {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .memo-list-item-preview {
    font-size: 11px;
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  .memo-list-item-del {
    opacity: 0;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 3px 5px;
    border-radius: 4px;
    font-size: 12px;
    transition: all var(--transition);
  }
  .memo-list-item:hover .memo-list-item-del { opacity: 1; }
  .memo-list-item-del:hover { background: #fff0f0; color: var(--danger); }
  .memo-empty-msg {
    padding: 14px 16px;
    font-size: 12px;
    color: var(--text-secondary);
    text-align: center;
  }

  /* ── Memo Editor Overlay ── */
  .memo-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.3);
    z-index: 300;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(2px);
  }
  .memo-overlay.open { display: flex; }

  .memo-editor {
    background: #fffef7;
    border-radius: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 500px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: memoIn 0.2s cubic-bezier(0,0,0.2,1);
  }

  @keyframes memoIn {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .memo-editor-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid #f0ead8;
  }
  .memo-editor-date {
    font-size: 11px;
    color: var(--text-secondary);
  }
  .memo-editor-actions { display: flex; gap: 6px; }
  .memo-editor-btn {
    background: transparent;
    border: none;
    font-size: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 4px;
    font-family: inherit;
    transition: all var(--transition);
  }
  .memo-editor-btn:hover { background: #f0ead8; color: var(--text-primary); }
  .memo-editor-btn.del:hover { background: #fff0f0; color: var(--danger); }

  .memo-editor-textarea {
    flex: 1;
    border: none;
    outline: none;
    resize: none;
    padding: 16px 20px 20px;
    font-size: 15px;
    font-family: inherit;
    color: var(--text-primary);
    line-height: 1.8;
    background: transparent;
    min-height: 260px;
  }
  .memo-editor-textarea::placeholder { color: #ccc8bb; }
</style>

<body>

<header class="header">
  <span class="header-icon">📋</span>
  <span class="header-title">할 일 관리</span>
  <span class="header-date" id="headerDate"></span>
</header>

<div class="page">
  <div class="todo-col">
    <h1 class="page-title">나의 할 일</h1>
    <div id="sectionList"></div>
    <button class="add-section-btn" onclick="addSection()">
      <span style="font-size:15px;line-height:1">+</span> 새 섹션 추가

  </div>
  <div class="calendar-col">
    <div class="calendar-card">
      <div class="cal-header">

        <div style="display:flex;align-items:center;gap:8px">

          <button class="cal-today-btn" onclick="calGoToday()">오늘</button>
          <div class="cal-nav">
            <button class="cal-nav-btn" onclick="calMove(-1)">&#8249;</button>

        </div>
      </div>
      <div id="calEventPanel" style="display:none; padding:0 14px 12px; border-top:1px solid var(--border); margin-top:4px;">
        <div id="calEventList" style="margin-top:10px;"></div>
      </div>
      <div class="cal-grid">
        <div class="cal-weekdays">
          <div class="cal-weekday">일</div>
          <div class="cal-weekday">월</div>
          <div class="cal-weekday">화</div>
          <div class="cal-weekday">수</div>
          <div class="cal-weekday">목</div>
          <div class="cal-weekday">금</div>
          <div class="cal-weekday">토</div>

    <div class="upcoming-card" id="upcomingCard" style="display:none">

        <span>다가오는 일정</span>
      </div>

    <div class="memo-list-card">
      <div class="memo-list-header">
        <span class="memo-list-header-left">📝 메모</span>

      <div class="memo-list-body" id="memoListBody"></div>

  </div>
</div>

<!-- Memo Editor Overlay -->
<div class="memo-overlay" id="memoOverlay" onclick="handleOverlayClick(event)">
  <div class="memo-editor" id="memoEditor">
    <div class="memo-editor-toolbar">
      <span class="memo-editor-date" id="memoEditorDate"></span>
      <div class="memo-editor-actions">
        <button class="memo-editor-btn del" onclick="deleteMemo()">삭제</button>
        <button class="memo-editor-btn" id="memoCopyBtn" onclick="copyMemo()">복사</button>
        <button class="memo-editor-btn" onclick="closeMemoEditor()">완료</button>
      </div>
    </div>
    <textarea class="memo-editor-textarea" id="memoEditorTextarea"
      placeholder="제목&#10;&#10;내용을 입력하세요..."></textarea>
  </div>
</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────

const STORAGE_KEY = 'todo_data_v2';

let data = loadData();

// ── Undo ───────────────────────────────────────────────────────────────────
const undoStack = [];
const MAX_UNDO = 30;

function pushHistory() {
  undoStack.push(JSON.stringify(data));
  if (undoStack.length > MAX_UNDO) undoStack.shift();
}

function undo() {
  if (undoStack.length === 0) return;
  data = JSON.parse(undoStack.pop());
  saveData();
  render();
  showUndoToast();
}

function showUndoToast() {
  let toast = document.getElementById('undoToast');
  if (!toast) {
    toast = document.createElement('div');
    toast.id = 'undoToast';
    toast.style.cssText = `
      position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
      background:#37352f; color:#fff; font-size:13px; padding:8px 18px;
      border-radius:8px; z-index:999; opacity:0;
      transition:opacity 0.2s; pointer-events:none; font-family:inherit;
    `;
    document.body.appendChild(toast);
  }
  toast.textContent = '↩ 실행 취소';
  toast.style.opacity = '1';
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => { toast.style.opacity = '0'; }, 1200);
}

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
    const active = document.activeElement;
    // 텍스트 입력 중엔 기본 동작 유지
    if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.contentEditable === 'true')) return;
    e.preventDefault();
    undo();
  }
});

function defaultData() {
  return {
    sections: [
      {
        id: uid(),
        name: '투두',
        open: true,
        items: [
          { id: uid(), text: '할 일', done: false, sub: false, link: '' },
          { id: uid(), text: '중국 여행 일정 다듬기 (10일 끝내기)', done: false, sub: false, link: '' },
          { id: uid(), text: '뉴뉴 회사소개서 보고 과제 연습해보기', done: false, sub: false, link: '' },
          { id: uid(), text: '7 20 동인내 가기', done: true, sub: false, link: '' },
          { id: uid(), text: '계란 사기, 종량제 20ℓ사기', done: true, sub: false, link: '' },
          { id: uid(), text: '샴푸 바디워시', done: true, sub: false, link: '' },
          { id: uid(), text: '판매할 책 정리하기', done: true, sub: false, link: '' },
          { id: uid(), text: '조리퐁, 오예스, 약과 (곧에 보낼꺼)', done: true, sub: false, link: 'https://blog.naver.com' },
        ]
      },
      {
        id: uid(),
        name: '단기',
        open: true,
        items: []
      },
      {
        id: uid(),
        name: '장기',
        open: true,
        items: []
      }
    ]
  };
}

function loadData() {
  try {
    const s = localStorage.getItem(STORAGE_KEY);
    if (s) {
      const parsed = JSON.parse(s);
      const names = parsed.sections.map(sec => sec.name);
      if (!names.includes('단기')) {
        parsed.sections.push({ id: uid(), name: '단기', open: true, items: [] });
      }
      if (!names.includes('장기')) {
        parsed.sections.push({ id: uid(), name: '장기', open: true, items: [] });
      }
      return parsed;
    }
  } catch(e) {}
  return defaultData();
}

function saveData(addHistory = false) {
  if (addHistory) pushHistory();
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function uid() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

// ── Rendering ──────────────────────────────────────────────────────────────

function render() {
  const list = document.getElementById('sectionList');
  list.innerHTML = '';
  data.sections.forEach(sec => {
    list.appendChild(buildSection(sec));
  });
  saveData();
}

function buildSection(sec) {
  const sorted = sortItems(sec.items);
  const pending = sorted.filter(i => !i.done);
  const done    = sorted.filter(i =>  i.done);
  const total   = sec.items.length;
  const doneCount = done.length;
  const pct = total ? Math.round(doneCount / total * 100) : 0;

  const wrap = document.createElement('div');
  wrap.className = 'section' + (sec.open ? ' open' : '');
  wrap.dataset.id = sec.id;

  // Header
  const hdr = document.createElement('div');
  hdr.className = 'section-header';
  hdr.innerHTML = `
    <span class="toggle-arrow">
      <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="4,2 10,7 4,12"/>
      </svg>
    </span>
    <input class="section-name" type="text" value="${escHtml(sec.name)}" placeholder="섹션 이름" />
    <span class="section-count">${pending.length}/${total}</span>
    <button class="section-del-btn" title="섹션 삭제">✕</button>
  `;
  hdr.querySelector('.toggle-arrow').addEventListener('click', e => {
    e.stopPropagation();
    sec.open = !sec.open;
    saveData();
    wrap.classList.toggle('open', sec.open);
  });
  hdr.querySelector('.section-name').addEventListener('change', e => {
    sec.name = e.target.value;
    saveData();
  });
  hdr.querySelector('.section-name').addEventListener('click', e => e.stopPropagation());
  hdr.querySelector('.section-del-btn').addEventListener('click', e => {
    e.stopPropagation();
    if (sec.items.length === 0 || confirm(`"${sec.name}" 섹션을 삭제할까요?`)) {
      pushHistory();
      data.sections = data.sections.filter(s => s.id !== sec.id);
      render();
    }
  });
  wrap.appendChild(hdr);

  // Progress
  const prog = document.createElement('div');
  prog.className = 'section-progress';
  prog.innerHTML = `<div class="section-progress-bar" style="width:${pct}%"></div>`;
  wrap.appendChild(prog);

  // Items list
  const ul = document.createElement('div');
  ul.className = 'items-list';

  // 빈 섹션에 드롭 가능하도록
  ul.addEventListener('dragover', e => {
    e.preventDefault();
    ul.classList.add('drag-target');
  });
  ul.addEventListener('dragleave', e => {
    if (!ul.contains(e.relatedTarget)) ul.classList.remove('drag-target');
  });
  ul.addEventListener('drop', e => {
    e.preventDefault();
    ul.classList.remove('drag-target');
    if (!dragItem) return;
    if (dragFromSec.id !== sec.id) {
      pushHistory();
      dragFromSec.items = dragFromSec.items.filter(i => i.id !== dragItem.id);
      sec.items.push(dragItem);
      dragItem = null; dragFromSec = null;
      render();
    }
  });

  pending.forEach(item => ul.appendChild(buildItem(item, sec)));

  if (pending.length > 0 && done.length > 0) {
    const div = document.createElement('div');
    div.className = 'done-divider';
    div.innerHTML = `<div class="done-divider-line"></div><span class="done-divider-label">완료 ${done.length}개</span><div class="done-divider-line"></div>`;
    ul.appendChild(div);
  }

  done.forEach(item => ul.appendChild(buildItem(item, sec)));

  // Add row
  const addRow = document.createElement('div');
  addRow.className = 'add-item-row';
  addRow.innerHTML = `
    <span class="add-item-icon" style="color:#c5c1bb">+</span>
    <input class="add-item-input" type="text" placeholder="할 일 추가..." />
  `;
  addRow.querySelector('.add-item-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const val = e.target.value.trim();
      if (val) {
        pushHistory();
        sec.items.push({ id: uid(), text: val, done: false, sub: false, link: '' });
        render();
        // Re-focus after render
        setTimeout(() => {
          const secEl = document.querySelector(`[data-id="${sec.id}"]`);
          if (secEl) secEl.querySelector('.add-item-input').focus();
        }, 30);
      }
    }
  });
  ul.appendChild(addRow);

  wrap.appendChild(ul);
  return wrap;
}

let dragItem = null;
let dragFromSec = null;

function buildItem(item, sec) {
  const row = document.createElement('div');
  row.className = 'todo-item' + (item.done ? ' done' : '') + (item.sub ? ' sub' : '');
  row.dataset.id = item.id;
  row.draggable = true;

  row.addEventListener('dragstart', e => {
    dragItem = item;
    dragFromSec = sec;
    setTimeout(() => row.classList.add('dragging'), 0);
    e.dataTransfer.effectAllowed = 'move';
  });
  row.addEventListener('dragend', () => {
    row.classList.remove('dragging');
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    document.querySelectorAll('.drag-target').forEach(el => el.classList.remove('drag-target'));
  });
  row.addEventListener('dragover', e => {
    e.preventDefault();
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
    if (dragItem && item.id !== dragItem.id) row.classList.add('drag-over');
  });
  row.addEventListener('drop', e => {
    e.preventDefault();
    if (!dragItem || item.id === dragItem.id) return;
    // 같은 섹션 내 순서 변경
    pushHistory();
    if (dragFromSec.id === sec.id) {
      const fromIdx = sec.items.findIndex(i => i.id === dragItem.id);
      const toIdx   = sec.items.findIndex(i => i.id === item.id);
      sec.items.splice(fromIdx, 1);
      sec.items.splice(toIdx, 0, dragItem);
    } else {
      dragFromSec.items = dragFromSec.items.filter(i => i.id !== dragItem.id);
      const toIdx = sec.items.findIndex(i => i.id === item.id);
      sec.items.splice(toIdx, 0, dragItem);
    }
    dragItem = null; dragFromSec = null;
    render();
  });

  row.innerHTML = `
    <label class="check-wrap">
      <input type="checkbox" ${item.done ? 'checked' : ''} />
      <span class="check-box">
        <svg width="10" height="8" viewBox="0 0 10 8" fill="none">
          <polyline points="1,4 4,7 9,1" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
    </label>
    <div style="flex:1;min-width:0">
      <div class="item-text" contenteditable="true" spellcheck="false">${escHtml(item.text)}</div>
      ${item.link ? `<a class="item-link" href="${escHtml(item.link)}" target="_blank" rel="noopener">
        <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 2h3v3M10 2L5 7M4.5 3H2a1 1 0 00-1 1v6a1 1 0 001 1h6a1 1 0 001-1V7.5"/></svg>
        ${escHtml(item.link.replace(/^https?:\/\//, '').split('/')[0])}
      </a>` : ''}
    </div>
    <div class="item-actions">
      <button class="item-btn sub-btn" title="들여쓰기">⇥</button>
      <button class="item-btn link-btn" title="링크 추가">🔗</button>
      <button class="item-btn del" title="삭제">✕</button>
    </div>
  `;

  // Checkbox
  row.querySelector('input[type=checkbox]').addEventListener('change', e => {
    pushHistory();
    item.done = e.target.checked;
    row.classList.toggle('done', item.done);
    // animate then re-render
    row.classList.add(item.done ? 'animate-exit-down' : 'animate-exit-up');
    setTimeout(() => render(), 340);
  });

  // Editable text
  const textEl = row.querySelector('.item-text');
  textEl.addEventListener('blur', () => {
    item.text = textEl.innerText.trim();
    saveData();
  });
  textEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); textEl.blur(); }
    if (e.key === 'Escape') { textEl.innerText = item.text; textEl.blur(); }
  });

  // Sub-item toggle
  row.querySelector('.sub-btn').addEventListener('click', () => {
    pushHistory();
    item.sub = !item.sub;
    render();
  });

  // Link button
  row.querySelector('.link-btn').addEventListener('click', () => {
    const url = prompt('링크를 입력하세요:', item.link || 'https://');
    if (url !== null) {
      pushHistory();
      item.link = url.trim();
      render();
    }
  });

  // Delete
  row.querySelector('.item-btn.del').addEventListener('click', () => {
    pushHistory();
    sec.items = sec.items.filter(i => i.id !== item.id);
    render();
  });

  return row;
}

function sortItems(items) {
  const pending = items.filter(i => !i.done);
  const done    = items.filter(i =>  i.done);
  return [...pending, ...done];
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Add section ────────────────────────────────────────────────────────────

function addSection() {
  const name = prompt('새 섹션 이름을 입력하세요:', '새 섹션');
  if (name === null) return;
  pushHistory();
  data.sections.push({
    id: uid(),
    name: name.trim() || '새 섹션',
    open: true,
    items: []
  });
  render();
}

// ── Date ───────────────────────────────────────────────────────────────────

function updateDate() {
  const d = new Date();
  const days = ['일','월','화','수','목','금','토'];
  document.getElementById('headerDate').textContent =
    `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
}

// ── Init ───────────────────────────────────────────────────────────────────

updateDate();
render();

// ── Google Calendar ────────────────────────────────────────────────────────

const GCAL_EMAIL = 'bongsu95@gmail.com';
let silentAuthDone = false;

function setAuthBtnSynced() {
  const btn = document.getElementById('calAuthBtn');
  btn.textContent = '동기화 ✓';
  btn.classList.add('synced');
  btn.disabled = false;
}

function trySilentAuth(retryCount = 0) {
  tokenClient.callback = async (resp) => {
    if (resp.error) {
      // 실패 시 최대 3번까지 재시도 (간격: 1s, 2s, 3s)
      if (retryCount < 3) {
        setTimeout(() => trySilentAuth(retryCount + 1), (retryCount + 1) * 1000);
      }
      return;
    }
    silentAuthDone = true;
    gapi.client.setToken({ access_token: resp.access_token });
    setAuthBtnSynced();
    await fetchCalEvents();
  };
  tokenClient.requestAccessToken({ prompt: 'none', login_hint: GCAL_EMAIL });
}

function maybeEnable() {
  if (!gapiInited || !gisInited) return;
  document.getElementById('calAuthBtn').disabled = false;
  if (!silentAuthDone) trySilentAuth();
}

async function handleAuthClick() {
  tokenClient.callback = async (resp) => {
    if (resp.error) { console.error(resp); return; }
    silentAuthDone = true;
    gapi.client.setToken({ access_token: resp.access_token });
    setAuthBtnSynced();
    await fetchCalEvents();
  };
  tokenClient.requestAccessToken({ prompt: 'consent', login_hint: GCAL_EMAIL });
}

async function fetchCalEvents() {
  const start = new Date(calYear, calMonth, 1).toISOString();
  const end   = new Date(calYear, calMonth + 1, 0, 23, 59, 59).toISOString();
  try {
    const res = await gapi.client.calendar.events.list({
      calendarId: 'primary',
      timeMin: start,
      timeMax: end,
      singleEvents: true,
      orderBy: 'startTime',
      maxResults: 100,
    });
    calEvents = {};
    (res.result.items || []).forEach(ev => {
      const d = new Date(ev.start.dateTime || ev.start.date);
      const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
      if (!calEvents[key]) calEvents[key] = [];
      calEvents[key].push(ev);
    });
    renderCal();
    renderUpcoming();
  } catch(e) { console.error(e); }
}

function renderUpcoming() {
  const card = document.getElementById('upcomingCard');
  const list = document.getElementById('upcomingList');
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  // 오늘 이후 일정만 모아서 날짜순 정렬
  const upcoming = [];
  Object.entries(calEvents).forEach(([key, events]) => {
    events.forEach(ev => {
      const d = new Date(ev.start.dateTime || ev.start.date);
      if (d >= today) upcoming.push(ev);
    });
  });
  upcoming.sort((a, b) => {
    return new Date(a.start.dateTime || a.start.date) - new Date(b.start.dateTime || b.start.date);
  });

  card.style.display = 'block';
  list.innerHTML = '';

  if (upcoming.length === 0) {
    list.innerHTML = '<div class="upcoming-empty">다가오는 일정이 없습니다</div>';
    return;
  }

  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const todayStr = today.toDateString();

  upcoming.slice(0, 10).forEach(ev => {
    const d = new Date(ev.start.dateTime || ev.start.date);
    const isToday = d.toDateString() === todayStr;
    const timeStr = ev.start.dateTime
      ? d.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      : '종일';

    const item = document.createElement('div');
    item.className = 'upcoming-item';
    item.innerHTML = `
      <div class="upcoming-date-badge ${isToday ? 'today-badge' : ''}">
        <div class="badge-month">${months[d.getMonth()]}</div>
        <div class="badge-day">${d.getDate()}</div>
      </div>
      <div class="upcoming-info">
        <div class="upcoming-title">${escHtml(ev.summary || '(제목 없음)')}</div>
        <div class="upcoming-time">${isToday ? '오늘 · ' : ''}${timeStr}</div>
      </div>
      <span class="upcoming-dot"></span>
    `;
    list.appendChild(item);
  });
}

function showDayEvents(y, m, d) {
  const key = `${y}-${m}-${d}`;
  const events = calEvents[key] || [];
  const panel = document.getElementById('calEventPanel');
  const list  = document.getElementById('calEventList');

  if (events.length === 0 && Object.keys(calEvents).length === 0) {
    panel.style.display = 'none';
    return;
  }

  panel.style.display = 'block';
  const dateStr = `${y}년 ${m+1}월 ${d}일`;
  list.innerHTML = `<div class="cal-panel-date">${dateStr}</div>`;

  if (events.length === 0) {
    list.innerHTML += `<div class="cal-no-event">일정 없음</div>`;
    return;
  }
  events.forEach(ev => {
    const timeStr = ev.start.dateTime
      ? new Date(ev.start.dateTime).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
      : '종일';
    list.innerHTML += `
      <div class="cal-event-item">
        <span class="cal-event-dot" style="background:${ev.colorId ? '#'+ev.colorId : '#4285f4'}"></span>
        <div>
          <div class="cal-event-title">${escHtml(ev.summary || '(제목 없음)')}</div>
          <div class="cal-event-time">${timeStr}</div>
        </div>
      </div>`;
  });
}

// ── Calendar ───────────────────────────────────────────────────────────────

let calYear, calMonth, calSelected;

function calInit() {
  const today = new Date();
  calYear  = today.getFullYear();
  calMonth = today.getMonth();
  calSelected = null;
  renderCal();
}

function calMove(dir) {
  calMonth += dir;
  if (calMonth > 11) { calMonth = 0; calYear++; }
  if (calMonth < 0)  { calMonth = 11; calYear--; }
  if (gapi.client && gapi.client.getToken()) fetchCalEvents();
  else renderCal();
}

function calGoToday() {
  const today = new Date();
  calYear  = today.getFullYear();
  calMonth = today.getMonth();
  if (gapi.client && gapi.client.getToken()) fetchCalEvents();
  else renderCal();
}

function renderCal() {
  const today = new Date();
  const months = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  document.getElementById('calMonthLabel').textContent = `${calYear}년 ${months[calMonth]}`;

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const lastDate = new Date(calYear, calMonth + 1, 0).getDate();
  const prevLast = new Date(calYear, calMonth, 0).getDate();
  const totalCells = Math.ceil((firstDay + lastDate) / 7) * 7;

  const grid = document.getElementById('calDays');
  grid.innerHTML = '';

  for (let i = 0; i < totalCells; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-day';

    let num, isOther = false;
    if (i < firstDay) {
      num = prevLast - firstDay + i + 1; isOther = true;
      cell.classList.add('other-month');
    } else if (i >= firstDay + lastDate) {
      num = i - firstDay - lastDate + 1; isOther = true;
      cell.classList.add('other-month');
    } else {
      num = i - firstDay + 1;
    }

    const numSpan = document.createElement('span');
    numSpan.textContent = num;
    cell.appendChild(numSpan);

    const col = i % 7;
    if (!isOther) {
      if (col === 0) cell.classList.add('sunday');
      if (col === 6) cell.classList.add('saturday');

      if (num === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear())
        cell.classList.add('today');

      if (calSelected && num === calSelected.d && calMonth === calSelected.m && calYear === calSelected.y)
        cell.classList.add('selected');

      // 이벤트 점
      const key = `${calYear}-${calMonth}-${num}`;
      if (calEvents[key] && calEvents[key].length > 0) {
        const dotRow = document.createElement('div');
        dotRow.className = 'event-dot-row';
        const count = Math.min(calEvents[key].length, 3);
        for (let d = 0; d < count; d++) {
          const dot = document.createElement('span');
          dot.className = 'event-dot';
          dotRow.appendChild(dot);
        }
        cell.appendChild(dotRow);
      }

      cell.addEventListener('click', () => {
        calSelected = { y: calYear, m: calMonth, d: num };
        showDayEvents(calYear, calMonth, num);
        renderCal();
      });
    } else {
      cell.classList.add('empty');
    }

    grid.appendChild(cell);
  }
}

calInit();

// ── Memo ───────────────────────────────────────────────────────────────────

const MEMO_LIST_KEY = 'memo_list_v1';
let memos = loadMemos();
let currentMemoId = null;
let memoSaveTimer;

function loadMemos() {
  try { return JSON.parse(localStorage.getItem(MEMO_LIST_KEY)) || []; } catch(e) { return []; }
}
function saveMemos() {
  localStorage.setItem(MEMO_LIST_KEY, JSON.stringify(memos));
}

function getMemoTitle(content) {
  const first = (content || '').split('\n')[0].trim();
  return first || '제목 없음';
}
function getMemoPreview(content) {
  const lines = (content || '').split('\n').filter(l => l.trim());
  return lines.length > 1 ? lines.slice(1).join(' ') : '';
}

function renderMemoList() {
  const body = document.getElementById('memoListBody');
  body.innerHTML = '';
  if (memos.length === 0) {
    body.innerHTML = '<div class="memo-empty-msg">메모가 없습니다</div>';
    return;
  }
  [...memos].reverse().forEach(memo => {
    const item = document.createElement('div');
    item.className = 'memo-list-item';
    item.innerHTML = `
      <span class="memo-list-item-icon">📄</span>
      <div class="memo-list-item-info">
        <div class="memo-list-item-title">${escHtml(getMemoTitle(memo.content))}</div>
        <div class="memo-list-item-preview">${escHtml(getMemoPreview(memo.content))}</div>
      </div>
      <button class="memo-list-item-del" onclick="event.stopPropagation();deleteMemoById('${memo.id}')">✕</button>
    `;
    item.addEventListener('click', () => openMemoEditor(memo.id));
    body.appendChild(item);
  });
}

function openMemoEditor(id) {
  if (id === null) {
    // 새 메모
    const newMemo = { id: uid(), content: '', updatedAt: Date.now() };
    memos.push(newMemo);
    saveMemos();
    currentMemoId = newMemo.id;
  } else {
    currentMemoId = id;
  }
  const memo = memos.find(m => m.id === currentMemoId);
  const ta = document.getElementById('memoEditorTextarea');
  ta.value = memo.content;
  const d = new Date(memo.updatedAt);
  document.getElementById('memoEditorDate').textContent =
    `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}`;
  document.getElementById('memoOverlay').classList.add('open');
  setTimeout(() => ta.focus(), 100);

  ta.oninput = () => {
    clearTimeout(memoSaveTimer);
    memoSaveTimer = setTimeout(() => {
      const m = memos.find(m => m.id === currentMemoId);
      if (m) { m.content = ta.value; m.updatedAt = Date.now(); saveMemos(); renderMemoList(); }
    }, 400);
  };
}

function copyMemo() {
  const text = document.getElementById('memoEditorTextarea').value;
  if (!text.trim()) return;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('memoCopyBtn');
    btn.textContent = '복사됨 ✓';
    setTimeout(() => { btn.textContent = '복사'; }, 1500);
  });
}

function closeMemoEditor() {
  // 내용 없으면 자동 삭제
  const m = memos.find(m => m.id === currentMemoId);
  if (m && !m.content.trim()) {
    memos = memos.filter(m => m.id !== currentMemoId);
    saveMemos();
  }
  document.getElementById('memoOverlay').classList.remove('open');
  currentMemoId = null;
  renderMemoList();
}

function deleteMemo() {
  if (!confirm('이 메모를 삭제할까요?')) return;
  memos = memos.filter(m => m.id !== currentMemoId);
  saveMemos();
  document.getElementById('memoOverlay').classList.remove('open');
  currentMemoId = null;
  renderMemoList();
}

function deleteMemoById(id) {
  memos = memos.filter(m => m.id !== id);
  saveMemos();
  renderMemoList();
}

function handleOverlayClick(e) {
  if (e.target === document.getElementById('memoOverlay')) closeMemoEditor();
}

renderMemoList();
</script>
